<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chiến trường Sương Câm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2140;--card:rgba(255,255,255,.88);--line:rgba(0,0,0,.16);--pri:#2f6bff;--ok:#1fa85a;--bad:#e5484d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Baloo 2",system-ui,sans-serif;font-weight:500;font-size:17px;line-height:1.35;color:var(--ink);background:linear-gradient(#bff0c4,#7ad3ff) fixed;transition:background .6s;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body.dark{--ink:#f4f0ff;--card:rgba(20,12,40,.74);--line:rgba(255,255,255,.22)}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 30px}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.mon{font-size:4.5rem;line-height:1.1}
.mascot{font-size:2.4rem}
.bubble{flex:1;background:var(--card);border:2px solid var(--line);border-radius:14px 14px 14px 4px;padding:6px 12px;min-height:40px}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.stat{justify-content:space-around;font-weight:800;font-size:1.15rem}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px 10px;margin:14px 0 12px}
.hc{position:relative;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 6px 8px;text-align:center;color:inherit;font:inherit;cursor:pointer;min-height:96px;display:flex;flex-direction:column;justify-content:center;gap:4px;box-shadow:0 3px 0 var(--line)}
.hc.atk{border-color:#e5484d}
.hc.def{border-color:#2f6bff}
.hc:disabled{opacity:.45}
.cost{position:absolute;top:-9px;left:-9px;background:#f5a524;color:#222;border-radius:50%;width:26px;height:26px;font-weight:800;display:grid;place-items:center}
.crk{position:absolute;top:2px;right:6px}
.btn{display:block;width:100%;background:var(--pri);color:#fff;border:0;border-radius:14px;padding:11px;font:inherit;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.25);cursor:pointer;margin:10px 0}
.btn:disabled{opacity:.4}
.pick{display:block;width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit}
.back{color:inherit;text-decoration:none;font-weight:800}
h2{margin:6px 0;font-weight:800}
small{opacity:.8}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.qb{width:100%;max-width:520px;text-align:center;max-height:92vh;overflow:auto;background:#fff;color:#1d2140;--line:#d9e1fb;margin:0}
.big{font-size:1.9rem;font-weight:800;line-height:1.2;margin:6px 0}
.opt{display:block;width:100%;text-align:left;background:#fff;color:#1d2140;border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px;font:inherit;box-shadow:0 3px 0 var(--line);cursor:pointer}
.opt.good{background:#d9f6e5;border-color:var(--ok)}
.opt.bad{background:#fde0e1;border-color:var(--bad)}
.ghost{background:none;border:0;font-size:1.3rem;cursor:pointer}
input{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font:inherit;outline:none;color:#1d2140;background:#fff}
.slots{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip2{background:#fff;color:#1d2140;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font:inherit;box-shadow:0 3px 0 var(--line);cursor:pointer}
.fb{border-radius:12px;padding:8px 12px;margin-top:8px}
.fb.g{background:#d9f6e5}
.fb.b{background:#fde0e1}
.qb .bar i{background:#f5a524;transition:none}
.float{position:fixed;left:50%;top:30%;font-weight:800;font-size:2rem;color:#fff;text-shadow:0 2px 6px #000;pointer-events:none;animation:up .9s forwards;z-index:9}
.shake{animation:shake .35s}
@keyframes up{from{transform:translate(-50%,0)}to{transform:translate(-50%,-70px);opacity:0}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@media (prefers-reduced-motion:reduce){.float,.shake{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const LV = ["A1", "A2", "B1", "B2", "C1"], LVN = ["Cơ bản · A1", "Sơ cấp · A2", "Trung cấp · B1", "Khá · B2", "Nâng cao · C1"];
// Câu chuyện càng về sau càng kịch tính: màu nền tối dần, quái mạnh dần, lời thoại căng dần
const ST = [
  { n: "Nấm Lắp Bắp", e: "🍄", hp: 18, a: 5, bg: ["#bff0c4", "#7ad3ff"], t: "Rừng Foxy vẫn yên bình… chỉ có vài cây nấm lắp bắp chặn đường." },
  { n: "Sâu Ngắt Câu", e: "🐛", hp: 26, a: 7, bg: ["#a8e0b0", "#6fb4e6"], t: "Sương mù dày dần. Những từ vỡ vụn nằm rải rác trên đường." },
  { n: "Dơi Nuốt Từ", e: "🦇", hp: 34, a: 9, bg: ["#c9b6ff", "#6a5acd"], t: "Tiếng cười tắt hẳn. Chúng lao ra từ màn sương, nuốt mất từng chữ." },
  { n: "Sói Lặng", e: "🐺", hp: 46, a: 11, bg: ["#7a5fa8", "#2b2250"], d: 1, t: "Cổng lâu đài hiện ra. Không ai còn nhớ cách nói “xin chào”." },
  { n: "Kẻ Lãng Quên", e: "🧟", hp: 58, a: 13, bg: ["#4a1d3a", "#14081f"], d: 1, t: "Nó nhìn bạn bằng đôi mắt của những ngôn ngữ đã chết. Không còn đường lùi." },
  { n: "Lãnh chúa Sương Câm", e: "🐉", hp: 90, a: 12, bg: ["#2a0a14", "#000"], d: 1, t: "Kẻ đã nuốt cả một ngôn ngữ thức giấc. Mọi thứ phụ thuộc vào những từ bạn mang theo." }
];
const L = {
  hit: [["Bốp! Nấm bay màu!", "Chiêu này thơm phết!", "Ngon lành!"], ["Trúng rồi! Giữ vững!", "Sương đang lùi lại!", "Tiếp tục nào!"], ["Đừng dừng lại!", "Vì tất cả ngôn ngữ!", "Ngay lúc này!"]],
  miss: [["Úi, trượt rồi!", "Hơi lệch xíu!"], ["Cẩn thận!", "Tập trung vào!"], ["Không được sai nữa!", "Sương đang nuốt từ của chúng ta!"]],
  start: [["Tiến lên nào!"], ["Sương dày quá…"], ["Đây là trận quyết định."]]
};
const $ = s => document.querySelector(s), app = $("#app");
let D, G, MUTE = false, W = {};
try { W = JSON.parse(localStorage.getItem("hnn_w") || "{}"); MUTE = !!JSON.parse(localStorage.getItem("hnn") || "{}").mute; } catch (e) {}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pick = a => a[Math.random() * a.length | 0];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = s => String(s || "").toLowerCase().replace(/[.,!?’']/g, "").replace(/\s+/g, " ").trim();
const stat = t => W[t] || (W[t] = { ok: 0, bad: 0 });
const saveW = () => { try { localStorage.setItem("hnn_w", JSON.stringify(W)); } catch (e) {} };
const POOL = lv => D.lessons.filter(l => l.level === LV[lv]).flatMap(l => l.words);
const td = () => new Date().toLocaleDateString("sv"), yd = () => new Date(Date.now() - 864e5).toLocaleDateString("sv");
function addXP(n) { // dùng chung điểm XP và chuỗi ngày với trang học
  try {
    const S = Object.assign({ xp: 0, streak: 0, last: "", lang: "en", done: {}, best: {}, mute: false }, JSON.parse(localStorage.getItem("hnn") || "{}"));
    if (S.last !== td()) { S.streak = S.last === yd() ? S.streak + 1 : 1; S.last = td(); }
    S.xp += n; localStorage.setItem("hnn", JSON.stringify(S));
  } catch (e) {}
}
let ac;
function bp(f, d, ty, v, dl) {
  if (MUTE) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + (dl || 0);
    o.type = ty || "sine"; o.frequency.value = f; g.gain.setValueAtTime(v || .15, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
const sOk = () => { bp(660, .1, "triangle"); bp(880, .15, "triangle", .15, .1); }, sBad = () => bp(200, .28, "sawtooth", .1), sHit = () => bp(120, .2, "square", .12);
function say(t) { if (!window.speechSynthesis) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = D.speech; u.rate = .9; speechSynthesis.speak(u); } catch (e) {} }
function fl(t) { const e = document.createElement("div"); e.className = "float"; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 900); }
function bg(i) { document.body.style.background = `linear-gradient(${ST[i].bg[0]},${ST[i].bg[1]}) fixed`; document.body.classList.toggle("dark", !!ST[i].d); }
const ln = k => pick(L[k][G.st < 2 ? 0 : G.st < 4 ? 1 : 2]);

/* ---------- bộ bài ---------- */
function mkCard(w, lv) {
  let h = 0; for (const ch of w.term) h += ch.charCodeAt(0);
  const k = h % 3 === 0 ? "def" : "atk", cost = w.term.includes(" ") ? 2 : 1, base = (k === "atk" ? 6 : 5) + 2 * lv;
  return { w, k, cost, pw: cost === 2 ? Math.round(base * 1.8) : base };
}
const score = w => { const s = stat(w.term); return s.bad * 2 - s.ok + Math.random() * 3; }; // từ hay sai được ưu tiên vào bộ bài
function addWords(n) {
  const have = new Set(G.deck.map(c => c.w.term));
  shuffle(POOL(G.lv).filter(w => !have.has(w.term))).slice(0, n).forEach(w => G.deck.push(mkCard(w, G.lv)));
}

/* ---------- màn hình ---------- */
function menu() {
  document.body.style.background = ""; document.body.classList.remove("dark"); bg(0);
  app.innerHTML = `<div class="wrap"><a class="back" href="index.html">← Về trang học</a>
    <div class="card center"><div class="mon">🦊⚔️🐉</div><h2>Chiến trường Sương Câm</h2><p>Sương Câm đã nuốt mất ngôn ngữ của cả vùng đất. Hãy dùng từ vựng làm vũ khí để lấy lại tiếng nói.</p></div>
    <h3>Chọn cấp độ bộ bài</h3>${LV.map((l, i) => `<button class="card pick" data-i="${i}"><b>${LVN[i]}</b><br><small>${POOL(i).length} từ · từ bạn hay sai sẽ xuất hiện nhiều hơn</small></button>`).join("")}</div>`;
  document.querySelectorAll(".pick").forEach(b => b.onclick = () => begin(+b.dataset.i));
}
function begin(lv) {
  G = { lv, hp: 60, max: 60, blk: 0, pe: 3, st: 0, bonus: 0, xd: 0, busy: 0, say: "", hit: 0, deck: [] };
  POOL(lv).slice().sort((a, b) => score(b) - score(a)).slice(0, 12).forEach(w => G.deck.push(mkCard(w, lv)));
  intro();
}
function intro() {
  const s = ST[G.st]; bg(G.st);
  app.innerHTML = `<div class="wrap center"><div class="card"><small>Trận ${G.st + 1}/6</small><div class="mon">${s.e}</div><h2>${s.n}</h2><p>${s.t}</p></div><button class="btn" id="go">${G.st === 5 ? "Đối đầu Lãnh chúa!" : "Chiến đấu!"}</button></div>`;
  $("#go").onclick = newBattle;
}
function newBattle() {
  const s = ST[G.st];
  G.e = { hp: s.hp, max: s.hp }; G.dr = shuffle(G.deck); G.dc = []; G.hand = []; G.turn = 0; G.cb = 0;
  startTurn();
}
function drawN(n) { for (let i = 0; i < n; i++) { if (!G.dr.length) { G.dr = shuffle(G.dc); G.dc = []; } if (!G.dr.length) break; G.hand.push(G.dr.pop()); } }
function startTurn() {
  G.turn++; G.pe = 3; G.blk = 0; G.busy = 0; drawN(5 + G.xd);
  G.roar = G.st >= 2 && G.turn % 3 === 0; G.int = Math.round(ST[G.st].a * (G.roar ? 1.8 : 1)); G.say = ln("start"); draw();
}
function draw() {
  const s = ST[G.st], e = G.e;
  app.innerHTML = `<div class="wrap">
    <div class="row"><a class="back" href="index.html">✕</a><b>Trận ${G.st + 1}/6 · ${s.n}</b></div>
    <div class="card center"><div class="mon ${G.hit ? "shake" : ""}">${s.e}</div>
      <div class="bar"><i style="width:${Math.max(0, e.hp / e.max * 100)}%;background:var(--bad)"></i></div>
      <small>${Math.max(0, e.hp)}/${e.max} HP · ⚠️ Lượt tới: ${G.int} sát thương${G.roar ? " — TIẾNG GẦM!" : ""}</small></div>
    <div class="row"><div class="mascot">${D.mascot.emoji}</div><div class="bubble">${esc(G.say || "")}</div></div>
    <div class="row stat"><span>❤️ ${G.hp}/${G.max}</span><span>🛡️ ${G.blk}</span><span>⚡ ${G.pe}</span></div>
    <div class="hand">${G.hand.map((c, i) => { const st = stat(c.w.term), wk = st.bad > st.ok;
      return `<button class="hc ${c.k}" data-i="${i}" ${c.cost > G.pe || G.busy ? "disabled" : ""}><span class="cost">${c.cost}</span>${wk ? '<span class="crk">💔</span>' : ""}<b>${esc(c.w.term)}</b><small>${c.k === "atk" ? "⚔️" : "🛡️"} ${c.pw}</small></button>`; }).join("")}</div>
    <button class="btn" id="et" ${G.busy ? "disabled" : ""}>Kết thúc lượt</button></div>`;
  G.hit = 0;
  document.querySelectorAll(".hc").forEach(b => b.onclick = () => play(+b.dataset.i));
  $("#et").onclick = endTurn;
}

/* ---------- đánh bài = trả lời câu hỏi ---------- */
function play(i) {
  const c = G.hand[i]; if (G.busy || c.cost > G.pe) return;
  G.busy = 1; draw();
  ask(c.w, g => {
    G.hand.splice(i, 1); G.dc.push(c); G.pe -= c.cost;
    let p = g ? c.pw : Math.floor(c.pw / 2);
    if (g) { G.cb++; p += Math.min(4, G.cb - 1) + (c.k === "atk" ? G.bonus : 0); } else G.cb = 0;
    if (c.k === "atk") { G.e.hp -= p; G.hit = 1; fl("-" + p); sHit(); } else { G.blk += p; fl("+" + p + " 🛡️"); }
    G.say = (G.cb >= 3 ? "Combo x" + G.cb + "! " : "") + ln(g ? "hit" : "miss"); G.busy = 0;
    if (G.e.hp <= 0) return win();
    draw();
  });
}
function mkQ(w) {
  const lv = G.lv, r = Math.random();
  const t = lv === 0 ? (r < .8 ? "mc" : "order") : lv === 1 ? (r < .6 ? "mc" : "order") : lv === 2 ? (r < .4 ? "mc" : r < .7 ? "cloze" : "order") : (r < .35 ? "cloze" : r < .7 ? "order" : "dict");
  const re = new RegExp(w.term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"), ws = w.example.replace(/[.?!]+$/, "").split(" ");
  if (t === "cloze" && re.test(w.example)) return { k: "type", s: "Điền từ còn thiếu · " + w.meaning, p: w.example.replace(re, "____"), a: w.term };
  if (t === "order" && ws.length > 2) { let b = shuffle(ws), n = 0; while (b.join(" ") === ws.join(" ") && n++ < 5) b = shuffle(ws); return { k: "order", s: "Sắp xếp thành câu · " + w.meaning, p: "🧩", a: w.example, b }; }
  if (t === "dict") return { k: "type", s: "Nghe và gõ lại từ bạn nghe được", p: "🎧", a: w.term, say: w.term };
  const d = Math.random() < .5, key = d ? "meaning" : "term", pool = POOL(G.lv);
  const o = shuffle([w[key]].concat(shuffle(pool.filter(x => x[key] !== w[key])).slice(0, 3).map(x => x[key])));
  return { k: "mc", s: d ? "Chọn nghĩa đúng" : "Chọn từ đúng", p: d ? w.term : w.meaning, a: w[key], o, say: d ? w.term : null };
}
function ask(w, cb) {
  const q = mkQ(w), ov = document.createElement("div"), lim = (q.k === "mc" ? 10 : 22) * 1000; ov.className = "ov"; document.body.appendChild(ov);
  let done = false, iv; const t0 = Date.now();
  ov.innerHTML = `<div class="qb card"><div class="bar"><i id="qt" style="width:100%"></i></div><small>${esc(q.s)}</small><div class="big">${esc(q.p)}</div>${q.say ? '<button class="ghost" id="sp">🔊</button>' : ""}<div id="qa">${
    q.k === "mc" ? q.o.map(t => `<button class="opt">${esc(t)}</button>`).join("")
    : q.k === "order" ? '<div class="slots" id="slots"></div><div class="bank" id="bank"></div><button class="btn" id="ck">Kiểm tra</button>'
    : '<input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ đáp án…"><button class="btn" id="ck">Kiểm tra</button>'}</div></div>`;
  const fin = v => {
    if (done) return; done = true; clearInterval(iv);
    const g = v !== null && norm(v) === norm(q.a), st = stat(w.term); g ? st.ok++ : st.bad++; saveW();
    ov.querySelectorAll(".opt").forEach(b => { if (b.textContent === q.a) b.classList.add("good"); else if (b.textContent === v) b.classList.add("bad"); });
    ov.querySelectorAll("button,input").forEach(x => x.disabled = true);
    ov.querySelector("#qa").insertAdjacentHTML("beforeend", `<div class="fb ${g ? "g" : "b"}">${g ? "Chuẩn rồi!" : "Đáp án: <b>" + esc(q.a) + "</b>"}</div>`);
    g ? (sOk(), say(w.term)) : sBad();
    setTimeout(() => { ov.remove(); cb(g); }, g ? 650 : 1600);
  };
  if (q.say) { say(q.say); ov.querySelector("#sp").onclick = () => say(q.say); }
  if (q.k === "mc") ov.querySelectorAll(".opt").forEach(b => b.onclick = () => fin(b.textContent));
  else if (q.k === "order") {
    const pk = [], dr = () => {
      ov.querySelector("#slots").innerHTML = pk.map(i => `<button class="chip2" data-i="${i}">${esc(q.b[i])}</button>`).join("");
      ov.querySelector("#bank").innerHTML = q.b.map((t, i) => pk.includes(i) ? "" : `<button class="chip2" data-i="${i}">${esc(t)}</button>`).join("");
      ov.querySelectorAll(".chip2").forEach(b => b.onclick = () => { if (done) return; const i = +b.dataset.i, at = pk.indexOf(i); if (at >= 0) pk.splice(at, 1); else pk.push(i); dr(); });
    };
    dr(); ov.querySelector("#ck").onclick = () => fin(pk.map(i => q.b[i]).join(" "));
  } else { const inp = ov.querySelector("#in"); inp.focus(); ov.querySelector("#ck").onclick = () => fin(inp.value); inp.onkeydown = e => { if (e.key === "Enter") fin(inp.value); }; }
  iv = setInterval(() => { const r = 1 - (Date.now() - t0) / lim; ov.querySelector("#qt").style.width = Math.max(0, r * 100) + "%"; if (r <= 0) fin(null); }, 100);
}

/* ---------- kết thúc lượt, thắng, thua ---------- */
function endTurn() {
  if (G.busy) return;
  G.dc.push(...G.hand); G.hand = [];
  const d = Math.max(0, G.int - G.blk); G.hp -= d; G.blk = 0;
  if (d > 0) { fl("-" + d + " ❤️"); sHit(); }
  if (G.hp <= 0) return lose();
  startTurn();
}
function win() {
  const xp = 15 + G.st * 5; addXP(xp);
  if (G.st === 5) return end(true, xp);
  const all = [["💚 Hồi 18 máu", () => G.hp = Math.min(G.max, G.hp + 18)], ["🗡️ +1 sát thương cho mọi đòn tấn công", () => G.bonus++], ["🃏 Rút thêm 1 lá mỗi lượt", () => G.xd = Math.min(2, G.xd + 1)], ["📖 Thêm 2 từ mới vào bộ bài", () => addWords(2)], ["❤️ +10 máu tối đa", () => { G.max += 10; G.hp += 10; }]];
  const ch = shuffle(all).slice(0, 3);
  app.innerHTML = `<div class="wrap center"><div class="card"><div class="mon">✨</div><h2>Thắng trận ${G.st + 1}!</h2><p>+${xp} XP · Chọn một phần thưởng</p></div>${ch.map((c, i) => `<button class="card pick" data-i="${i}">${c[0]}</button>`).join("")}</div>`;
  document.querySelectorAll(".pick").forEach(b => b.onclick = () => { ch[+b.dataset.i][1](); G.st++; intro(); });
}
function lose() { end(false, 0); }
function end(ok, xp) {
  if (ok) addXP(60);
  app.innerHTML = `<div class="wrap center"><div class="card"><div class="mon">${ok ? "🏆" : "💀"}</div><h2>${ok ? "Sương Câm tan biến!" : "Ngã xuống ở trận " + (G.st + 1)}</h2>
    <p>${ok ? "Tiếng nói trở lại với vùng đất. +60 XP thưởng hạ Lãnh chúa." : "Sương lại dày thêm… nhưng những từ bạn đã học vẫn còn nguyên. Từ bạn trả lời sai sẽ xuất hiện nhiều hơn ở lần sau."}</p></div>
    <button class="btn" id="a">Chơi lại</button><a class="back" href="index.html">← Về trang học</a></div>`;
  $("#a").onclick = menu;
}

fetch("data/en.json").then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => {
  D = d; D.lessons.forEach(l => l.words.forEach(w => w.level = l.level)); menu();
}).catch(() => { app.innerHTML = '<div class="wrap"><div class="card">Không tải được dữ liệu từ vựng. Hãy mở qua đường link GitHub Pages, đừng mở trực tiếp file trên máy.</div></div>'; });
</script>
